<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Far Dimsum</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    rgba(70, 35, 15, 0.65),
                    rgba(70, 35, 15, 0.65)
                ),
                #f3dfc1;
        }

        .login-box {

            width: 380px;
            max-width: 90%;

            padding: 35px;

            background: #fff8ee;

            border-radius: 20px;

            box-shadow:
                0 15px 40px rgba(0,0,0,0.25);

            text-align: center;
        }

        .logo {

            width: 80px;
            height: 80px;

            margin: auto;
            margin-bottom: 15px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #8b5e3c;

            color: white;

            font-size: 25px;
            font-weight: bold;
        }

        h1 {

            margin-bottom: 5px;

            color: #6b3f22;
        }

        .subtitle {

            color: #8b6b55;

            margin-bottom: 25px;
        }

        input {

            width: 100%;

            padding: 13px;

            margin-bottom: 15px;

            border: 1px solid #d4b89a;

            border-radius: 10px;

            font-size: 15px;

            outline: none;
        }

        input:focus {

            border-color: #8b5e3c;

            box-shadow:
                0 0 0 2px rgba(139,94,60,0.15);
        }

        button {

            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 10px;

            background: #8b5e3c;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {

            background: #6f472d;
        }

        .error {

            background: #ffe0e0;

            color: #a00000;

            padding: 10px;

            border-radius: 8px;

            margin-bottom: 15px;
        }

        .accounts {

            margin-top: 20px;

            font-size: 12px;

            color: #8b6b55;
        }

    </style>

</head>

<body>

    <div class="login-box">

        <div class="logo">
            FD
        </div>

        <h1>FAR DIMSUM</h1>

        <div class="subtitle">
            Sistem Kasir
        </div>

        {% if error %}

        <div class="error">
            {{ error }}
        </div>

        {% endif %}

        <form method="POST">

            <input
                type="text"
                name="username"
                placeholder="Username"
                required
                autofocus
            >

            <input
                type="password"
                name="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                LOGIN
            </button>

        </form>

        <div class="accounts">

            Akun tersedia: asyifa • muhsafar • admin

        </div>

    </div>

</body>

</html>
